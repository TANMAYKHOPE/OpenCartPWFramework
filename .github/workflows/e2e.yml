name: Playwright E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pw-framework .

      - name: Run all Playwright tests
        run: |
          mkdir -p reports allure-results
          docker run --rm \
            -e CI=true \
            -e ENV=qa \
            -e BASE_URL="${{ secrets.BASE_URL }}" \
            -e USERNAME="${{ secrets.USERNAME }}" \
            -e PASSWORD="${{ secrets.PASSWORD }}" \
            -e API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            -e API_TOKEN="${{ secrets.API_TOKEN }}" \
            -e OAUTH_CLIENT_ID="${{ secrets.OAUTH_CLIENT_ID }}" \
            -e OAUTH_CLIENT_SECRET="${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -e GRANT_TYPE="${{ secrets.GRANT_TYPE }}" \
            -v "$PWD/reports:/app/reports" \
            -v "$PWD/allure-results:/app/allure-results" \
            pw-framework npx playwright test --project=chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14
